<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Hábitos - Menta & Jade</title>
    <style>
        :root {
            /* Paleta Clarita: Menta, Salvia, Jade */
            --primary: #52796f;       /* Verde Jade Medio */
            --primary-dark: #2f4f4f;  /* Verde Oscuro Slaty */
            --primary-light: #cad2c5; /* Salvia Muy Claro */
            
            --bg-body: #121212;       /* Negro suave */
            --bg-card: #1e1e1e;       /* Gris oscuro */
            --bg-hover: #2a2a2a;      
            
            --text-main: #e8e8e8;     /* Blanco Hueso */
            --text-muted: #a0a0a0;
            
            --border: #333333;
            --danger: #bc4749;        /* Rojo Mate */
            
            --radius: 12px;
            --sidebar-width: 320px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            scrollbar-width: thin;
            scrollbar-color: #555 #121212;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* --- LAYOUT PRINCIPAL --- */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* SIDEBAR */
        aside.sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background-color: #161616;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
            height: 100%;
        }

        /* MAIN CONTENT */
        main.main-content {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-wrapper {
            width: 100%;
            max-width: 1400px; /* Más ancho para acomodar 3 graficas grandes */
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 40px; /* Más espacio entre secciones */
            padding-bottom: 80px;
        }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            aside.sidebar { width: 100%; height: auto; max-height: 35vh; border-right: none; border-bottom: 1px solid var(--border); }
            main.main-content { height: 65vh; }
            .content-wrapper { padding: 15px; }
        }

        /* CARDS */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        h1 { 
            font-size: 2rem; 
            font-weight: 300; 
            color: var(--primary-light); 
            letter-spacing: 1px;
            text-align: center;
            margin: 0 0 20px 0;
            text-transform: capitalize;
        }
        
        h2 { 
            font-size: 1.1rem; 
            font-weight: 600; 
            color: var(--text-main); 
            margin-bottom: 15px; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 10px;
        }
        
        h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }

        /* INPUTS & BOTONES */
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: #252525;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        .btn-primary { 
            background: var(--primary); 
            color: #fff; 
            width: 100%; 
            border: none;
            font-weight: 600;
            padding: 12px;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        
        /* LISTA HÁBITOS */
        .habit-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .habit-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px;
            background: #252525;
            border-radius: 8px;
            border-left: 4px solid transparent;
        }
        .habit-info { display: flex; align-items: center; gap: 12px; }
        .habit-color { 
            width: 12px; height: 12px; border-radius: 50%; 
        }
        .btn-delete { 
            background: transparent; color: var(--text-muted); border: none; 
            cursor: pointer; font-size: 1.2rem; padding: 0 5px;
        }
        .btn-delete:hover { color: var(--danger); }

        /* ESTADÍSTICAS MENSUALES */
        .global-stat { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        
        .stat-circle {
            position: relative; width: 70px; height: 70px; border-radius: 50%;
            background: conic-gradient(var(--primary) 0%, #333 0%);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .stat-circle::before {
            content: ''; position: absolute; width: 56px; height: 56px;
            background: var(--bg-card); border-radius: 50%;
        }
        .stat-value { position: relative; font-weight: 700; font-size: 1.1rem; }

        .habit-stats-list { display: flex; flex-direction: column; gap: 12px; }
        .habit-stat-row { display: flex; flex-direction: column; gap: 6px; }
        .habit-stat-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); }
        
        .progress-track { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        /* CALENDARIO */
        .calendar-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .month-nav-btn { 
            background: var(--bg-card); border: 1px solid var(--border); 
            color: var(--primary-light); width: 40px; height: 40px; cursor: pointer;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }
        .month-nav-btn:hover { background: var(--bg-hover); border-color: var(--primary); }

        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;
        }

        .day-name { text-align: center; font-size: 0.9rem; color: var(--text-muted); font-weight: 600; padding-bottom: 10px; }

        .day-cell {
            background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border);
            padding: 10px; cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; gap: 8px;
            min-height: 90px;
        }

        .day-cell:hover { border-color: var(--primary-light); transform: translateY(-2px); background: #252525; }
        .day-cell.today { background: rgba(82, 121, 111, 0.15); border-color: var(--primary); }
        .day-cell.empty { background: transparent; border: none; cursor: default; }

        .day-number { font-weight: 600; font-size: 0.95rem; color: var(--text-muted); }

        .habit-dots { display: flex; flex-wrap: wrap; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; opacity: 0.9; box-shadow: 0 0 2px rgba(0,0,0,0.5); }

        /* --- ANUALES (MAIN AREA) --- */
        /* Grid adaptativo: Con 3 items ocupan ancho (minmax 220px), con mas se encogen */
        .annual-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 40px; /* Separación grande */
            justify-items: center; /* Centrar si no llenan fila */
        }

        .annual-chart-item {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            background: #252525; padding: 30px 20px; border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%; /* Para respetar el grid */
            max-width: 300px; /* Que no se estiren infinitamente si hay 1 solo */
            transition: transform 0.3s;
        }
        
        .annual-chart-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        /* SVG Charts más grandes */
        svg.circle-chart { width: 100px; height: 100px; transform: rotate(-90deg); }
        circle.circle-bg { fill: none; stroke: #333; stroke-width: 6; }
        circle.circle-progress { 
            fill: none; stroke-width: 6; stroke-linecap: round;
            transition: stroke-dasharray 0.8s ease;
        }
        
        /* Texto dentro del SVG centrado */
        .chart-text-bg {
            fill: none; /* Transparente */
        }
        .chart-percent-text {
            fill: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            transform: rotate(90deg); /* Counter rotate to read straight */
            transform-origin: 50% 50%;
        }

        .annual-label { 
            font-size: 1.1rem; 
            text-align: center; 
            color: var(--text-main); 
            font-weight: 600; 
        }
        .annual-percent-label { font-size: 0.9rem; color: var(--primary-light); font-weight: bold; }
        .annual-total { font-size: 0.9rem; color: var(--text-muted); margin-top: -5px; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center;
            z-index: 200; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.open { display: flex; opacity: 1; }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 30px; border-radius: var(--radius); width: 90%; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .checkbox-label {
            display: flex; align-items: center; padding: 14px;
            border: 1px solid var(--border); border-radius: 8px;
            cursor: pointer; margin-bottom: 12px; background: #252525;
        }
        .checkbox-label:hover { border-color: var(--primary); }
        .checkbox-label input { display: none; }
        .custom-checkbox {
            width: 22px; height: 22px; border: 2px solid var(--text-muted); border-radius: 4px;
            margin-right: 14px; display: flex; align-items: center; justify-content: center;
        }
        .checkbox-label input:checked + .custom-checkbox { background: var(--primary); border-color: var(--primary); }
        .custom-checkbox::after { content: '✔'; color: #fff; font-size: 14px; display: none; }
        .checkbox-label input:checked + .custom-checkbox::after { display: block; }

        .no-habits-msg { text-align: center; color: var(--text-muted); margin-top: 20px; font-style: italic; }
        .close-modal-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; float: right; }
        .close-modal-btn:hover { color: var(--text-main); }

    </style>
</head>
<body>

<div class="app-container">
    <!-- SIDEBAR: Hábitos y Mensual -->
    <aside class="sidebar">
        <div class="sidebar-content">
            
            <!-- Gestión Hábitos -->
            <div class="card">
                <h2 style="border:none; color:var(--primary-light); margin-bottom:10px;">Mis Hábitos</h2>
                <form id="habit-form">
                    <input type="text" id="habit-input" placeholder="Ej. Meditar..." autocomplete="off">
                    <button type="submit" class="btn-primary">Agregar Hábito</button>
                </form>

                <ul id="habit-list" class="habit-list" style="margin-top: 15px;"></ul>
                <div id="empty-habits-msg" class="no-habits-msg">No hay hábitos creados.</div>
            </div>

            <!-- Estadísticas Mensuales -->
            <div class="card">
                <h2>Este Mes</h2>
                
                <div class="global-stat">
                    <div class="stat-circle" id="global-progress-circle">
                        <span class="stat-value" id="global-progress-text">0%</span>
                    </div>
                    <div class="stat-label">
                        <strong style="color:var(--text-main)">Progreso Global</strong><br>
                        <span style="font-size:0.8rem; color:var(--text-muted)">Cumplimiento total</span>
                    </div>
                </div>

                <h3>Por Hábito</h3>
                <div class="habit-stats-list" id="habit-stats-list"></div>
            </div>

        </div>
    </aside>

    <!-- MAIN CONTENT: Calendario y Anuales -->
    <main class="main-content">
        <div class="content-wrapper">
            
            <!-- CABECERA GRANDE NUEVA -->
            <h1 id="page-header">Hábitos de Enero</h1>

            <!-- Sección Calendario -->
            <div class="card" style="flex: 1; display:flex; flex-direction:column;">
                <div class="calendar-header">
                    <button class="month-nav-btn" id="prev-month">❮</button>
                    <!-- Ya no mostramos fecha aqui porque esta en la cabecera H1 -->
                    <button class="month-nav-btn" id="next-month">❯</button>
                </div>

                <div class="calendar-grid" id="calendar-grid">
                    <div class="day-name">Dom</div>
                    <div class="day-name">Lun</div>
                    <div class="day-name">Mar</div>
                    <div class="day-name">Mié</div>
                    <div class="day-name">Jue</div>
                    <div class="day-name">Vie</div>
                    <div class="day-name">Sáb</div>
                </div>
            </div>

            <!-- Sección Estadísticas Anuales -->
            <div class="card">
                <h2>Resumen Anual <span style="font-size:0.8rem; font-weight:400; color:var(--text-muted); text-transform:none;">(Progreso Total y Conteo)</span></h2>
                <div class="annual-stats-grid" id="annual-stats-grid">
                    <!-- Gráficos generados por JS -->
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="day-modal">
    <div class="modal-content">
        <button class="close-modal-btn" onclick="document.getElementById('day-modal').classList.remove('open')">×</button>
        <h3 id="modal-date-title" style="color:var(--text-main); margin-bottom:20px;">Detalles</h3>
        <div id="modal-habits-container" class="habit-check-list"></div>
    </div>
</div>

<script>
    // --- ESTADO ---
    const state = {
        currentDate: new Date(),
        habits: [],
        logs: {} 
    };

    // Paleta CLARA (Menta, Jade, Salvia)
    const habitColors = [
        '#52796f', // Jade Medio
        '#84a98c', // Salvia Verde
        '#cad2c5', // Salvia Claro
        '#5f8d4e', // Verde Hoja
        '#285430', // Verde Bosque (Contraste)
        '#a5d6a7', // Menta Brillante
        '#4db6ac', // Teal Claro
        '#80cbc4'  // Cyan Verde Claro
    ];

    // --- DOM ---
    const habitForm = document.getElementById('habit-form');
    const habitInput = document.getElementById('habit-input');
    const habitListEl = document.getElementById('habit-list');
    const calendarGrid = document.getElementById('calendar-grid');
    const pageHeader = document.getElementById('page-header'); // Nuevo Header
    const emptyHabitsMsg = document.getElementById('empty-habits-msg');
    
    // Stats Elements
    const globalProgressCircle = document.getElementById('global-progress-circle');
    const globalProgressText = document.getElementById('global-progress-text');
    const habitStatsList = document.getElementById('habit-stats-list');
    const annualStatsGrid = document.getElementById('annual-stats-grid');

    // --- INIT ---
    function init() {
        loadData();
        renderHabitList();
        renderCalendar();
        updateStats();
        renderAnnualStats();
    }

    // --- DATA ---
    function loadData() {
        const saved = localStorage.getItem('habitTrackerMenta');
        if (saved) {
            const parsed = JSON.parse(saved);
            state.habits = parsed.habits || [];
            state.logs = parsed.logs || {};
        }
    }

    function saveData() {
        localStorage.setItem('habitTrackerMenta', JSON.stringify(state));
    }

    // --- HABITS ---
    habitForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if(!habitInput.value.trim()) return;
        
        const newHabit = {
            id: Date.now().toString(),
            name: habitInput.value,
            color: habitColors[state.habits.length % habitColors.length]
        };
        
        state.habits.push(newHabit);
        saveData();
        habitInput.value = '';
        renderHabitList();
        renderCalendar();
        updateStats();
        renderAnnualStats();
    });

    function deleteHabit(id) {
        if(!confirm('¿Eliminar hábito?')) return;
        state.habits = state.habits.filter(h => h.id !== id);
        for(let d in state.logs) {
            state.logs[d] = state.logs[d].filter(hId => hId !== id);
            if(state.logs[d].length === 0) delete state.logs[d];
        }
        saveData();
        renderHabitList();
        renderCalendar();
        updateStats();
        renderAnnualStats();
    }

    function toggleHabit(dateStr, id) {
        if(!state.logs[dateStr]) state.logs[dateStr] = [];
        const idx = state.logs[dateStr].indexOf(id);
        if(idx === -1) state.logs[dateStr].push(id);
        else state.logs[dateStr].splice(idx, 1);
        saveData();
        renderCalendar();
        updateStats();
        renderAnnualStats();
    }

    // --- RENDER ---
    function renderHabitList() {
        habitListEl.innerHTML = '';
        if(state.habits.length === 0) emptyHabitsMsg.style.display = 'block';
        else {
            emptyHabitsMsg.style.display = 'none';
            state.habits.forEach(h => {
                const li = document.createElement('li');
                li.className = 'habit-item';
                li.style.borderLeftColor = h.color; // Indicador lateral de color
                li.innerHTML = `
                    <div class="habit-info">
                        <div class="habit-color" style="background:${h.color}"></div>
                        <span style="color:var(--text-main)">${h.name}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteHabit('${h.id}')">×</button>
                `;
                habitListEl.appendChild(li);
            });
        }
    }

    function changeMonth(dir) {
        state.currentDate.setMonth(state.currentDate.getMonth() + dir);
        renderCalendar();
        updateStats();
        renderAnnualStats();
    }
    document.getElementById('prev-month').onclick = () => changeMonth(-1);
    document.getElementById('next-month').onclick = () => changeMonth(1);

    function renderCalendar() {
        const headers = Array.from(calendarGrid.querySelectorAll('.day-name'));
        calendarGrid.innerHTML = '';
        headers.forEach(h => calendarGrid.appendChild(h));

        const year = state.currentDate.getFullYear();
        const month = state.currentDate.getMonth();
        
        const monthNames = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
        
        // ACTUALIZAR CABECERA PRINCIPAL
        pageHeader.textContent = `Hábitos de ${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();

        for(let i=0; i<firstDay; i++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell empty';
            calendarGrid.appendChild(cell);
        }

        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            if(today.getFullYear()===year && today.getMonth()===month && today.getDate()===d) cell.classList.add('today');

            cell.innerHTML = `<div class="day-number">${d}</div>`;
            
            const dots = document.createElement('div');
            dots.className = 'habit-dots';
            
            if(state.logs[dateStr]) {
                state.logs[dateStr].forEach(id => {
                    const h = state.habits.find(x => x.id === id);
                    if(h) {
                        const dot = document.createElement('div');
                        dot.className = 'dot';
                        dot.style.background = h.color;
                        dots.appendChild(dot);
                    }
                });
            }
            cell.appendChild(dots);
            
            cell.onclick = () => openModal(dateStr);
            calendarGrid.appendChild(cell);
        }
    }

    // --- STATS ---
    function updateStats() {
        const y = state.currentDate.getFullYear();
        const m = state.currentDate.getMonth();
        const daysInMonth = new Date(y, m+1, 0).getDate();

        let total = 0;
        let done = 0;
        
        habitStatsList.innerHTML = '';

        state.habits.forEach(h => {
            let hDone = 0;
            for(let d=1; d<=daysInMonth; d++) {
                const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                if(state.logs[ds] && state.logs[ds].includes(h.id)) hDone++;
            }
            total += daysInMonth;
            done += hDone;
            
            const pct = Math.round((hDone/daysInMonth)*100);
            const row = document.createElement('div');
            row.className = 'habit-stat-row';
            row.innerHTML = `
                <div class="habit-stat-header">
                    <span>${h.name}</span>
                    <span>${pct}%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" style="width:${pct}%; background:${h.color}"></div>
                </div>
            `;
            habitStatsList.appendChild(row);
        });

        const globalPct = total === 0 ? 0 : Math.round((done/total)*100);
        globalProgressCircle.style.background = `conic-gradient(var(--primary) ${globalPct}%, #333 ${globalPct}%)`;
        globalProgressText.textContent = `${globalPct}%`;
    }

    function renderAnnualStats() {
        annualStatsGrid.innerHTML = '';
        const currentYear = new Date().getFullYear();
        const isLeap = (currentYear % 4 === 0 && currentYear % 100 !== 0) || (currentYear % 400 === 0);
        const daysInYear = isLeap ? 366 : 365;

        state.habits.forEach(h => {
            let yearTotal = 0;
            Object.keys(state.logs).forEach(dateStr => {
                if(dateStr.startsWith(currentYear + '-')) {
                    if(state.logs[dateStr].includes(h.id)) yearTotal++;
                }
            });

            const pct = Math.min(100, Math.round((yearTotal / daysInYear) * 100));
            
            // SVG Params (Tamaño aumentado)
            const r = 40; 
            const c = 2 * Math.PI * r;
            const offset = c - (pct / 100) * c;

            const item = document.createElement('div');
            item.className = 'annual-chart-item';
            item.innerHTML = `
                <svg class="circle-chart" viewBox="0 0 100 100">
                    <circle class="circle-bg" cx="50" cy="50" r="${r}"></circle>
                    <circle class="circle-progress" cx="50" cy="50" r="${r}"
                        style="stroke-dasharray:${c}; stroke-dashoffset:${offset}; stroke:${h.color};">
                    </circle>
                    <text x="50" y="50" class="chart-percent-text">${pct}%</text>
                </svg>
                
                <div style="text-align:center;">
                    <div class="annual-label">${h.name}</div>
                    <div class="annual-total">Total: ${yearTotal} veces</div>
                    <div class="annual-percent-label">${pct}% del año</div>
                </div>
            `;
            annualStatsGrid.appendChild(item);
        });
    }

    function openModal(dateStr) {
        const modal = document.getElementById('day-modal');
        document.getElementById('modal-date-title').textContent = dateStr;
        const container = document.getElementById('modal-habits-container');
        container.innerHTML = '';
        
        state.habits.forEach(h => {
            const checked = state.logs[dateStr] && state.logs[dateStr].includes(h.id);
            const l = document.createElement('label');
            l.className = 'checkbox-label';
            l.innerHTML = `
                <input type="checkbox" ${checked?'checked':''} data-id="${h.id}">
                <div class="custom-checkbox"></div>
                <span style="color:var(--text-main)">${h.name}</span>
            `;
            l.querySelector('input').onchange = (e) => toggleHabit(dateStr, h.id);
            container.appendChild(l);
        });
        modal.classList.add('open');
    }

    document.getElementById('day-modal').onclick = (e) => {
        if(e.target.id === 'day-modal') e.target.classList.remove('open');
    };

    init();
</script>
</body>
</html>
