<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Hábitos - Pro Dual Ring</title>
    <style>
        :root {
            /* Paleta Matte Profesional */
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-hover: #2a2a2a;
            --text-main: #e8e8e8;
            --text-muted: #9ca3af;
            --border: #2d2d2d;
            --radius: 12px;
            --sidebar-width: 320px;

            /* Colores de Estado */
            --color-done: #52796f;      /* Verde Jade Mate (Éxito) */
            --color-missed: #c05646;    /* Rojo Ladrillo Mate (Fallo) */
            --color-empty: #374151;      /* Gris Oscuro (Vacio) */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            scrollbar-width: thin;
            scrollbar-color: #444 #121212;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52796f; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        .app-container { display: flex; width: 100%; height: 100%; }

        /* --- SIDEBAR --- */
        aside.sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background-color: #161616;
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .sidebar-content {
            padding: 24px;
            display: flex; flex-direction: column; gap: 30px;
            overflow-y: auto; height: 100%;
        }

        /* --- MAIN CONTENT --- */
        main.main-content {
            flex: 1; height: 100%; overflow-y: auto;
            background-color: var(--bg-body);
            display: flex; flex-direction: column; align-items: center;
        }
        .content-wrapper {
            width: 100%; max-width: 1400px; padding: 30px;
            display: flex; flex-direction: column; gap: 50px; padding-bottom: 100px;
        }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            aside.sidebar { width: 100%; height: auto; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
            main.main-content { height: 60vh; }
            .content-wrapper { padding: 15px; }
        }

        /* --- CARDS & TEXT --- */
        .card {
            background: var(--bg-card); border-radius: var(--radius);
            padding: 24px; border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        
        h1 { 
            font-size: 2rem; font-weight: 600; color: var(--text-main); 
            text-align: center; margin: 0 0 20px 0; letter-spacing: -0.5px; 
        }
        h2 { 
            font-size: 1rem; font-weight: 700; color: var(--text-muted); 
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; 
            border-bottom: 1px solid var(--border); padding-bottom: 10px; 
        }

        /* --- INPUTS & LIST --- */
        input[type="text"] {
            width: 100%; padding: 14px; background: #252525;
            border: 1px solid var(--border); border-radius: 8px; color: var(--text-main);
            outline: none; margin-bottom: 12px; font-size: 0.95rem; transition: border 0.2s;
        }
        input[type="text"]:focus { border-color: var(--color-done); }

        .btn-primary { 
            background: var(--color-done); color: #fff; width: 100%; border: none;
            font-weight: 600; padding: 14px; border-radius: 8px; cursor: pointer; transition: background 0.2s;
        }
        .btn-primary:hover { background: #3b5c54; }

        .habit-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .habit-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; background: #252525; border-radius: 8px;
            border-left: 3px solid transparent;
        }
        .habit-info { display: flex; align-items: center; gap: 12px; }
        .habit-color { width: 10px; height: 10px; border-radius: 50%; }
        .btn-delete { background: transparent; color: #666; border: none; cursor: pointer; font-size: 1.2rem; padding: 0 5px; }
        .btn-delete:hover { color: var(--color-missed); }

        /* --- ESTADÍSTICAS (MENSUALES) --- */
        .stat-row {
            display: flex; align-items: center; gap: 20px;
            padding: 12px 0; border-bottom: 1px solid #2a2a2a;
        }
        .stat-row:last-child { border-bottom: none; }
        
        .stat-name { flex: 1; font-weight: 500; color: var(--text-main); }
        .stat-details { font-size: 0.75rem; color: var(--text-muted); text-align: right; }
        
        /* GRÁFICO DE ANILLO CSS */
        .ring-chart {
            position: relative;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: conic-gradient(var(--color-empty) 0% 100%);
            flex-shrink: 0;
        }
        /* Hueco del donut */
        .ring-chart::before {
            content: ''; position: absolute;
            inset: 8px; /* Grosor del anillo */
            background: var(--bg-card);
            border-radius: 50%;
        }
        /* Texto del centro */
        .ring-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.7rem; font-weight: 700; color: var(--text-main);
            z-index: 2;
        }

        /* --- CALENDARIO --- */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .month-nav-btn { 
            background: var(--bg-card); border: 1px solid var(--border); 
            color: var(--text-main); width: 40px; height: 40px; cursor: pointer;
            border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
        }
        .month-nav-btn:hover { background: var(--bg-hover); border-color: var(--color-done); }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
        .day-name { text-align: center; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; padding-bottom: 10px; }
        
        .day-cell {
            background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border);
            padding: 10px; cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; gap: 8px; min-height: 90px;
        }
        .day-cell:hover { border-color: #555; transform: translateY(-2px); background: #252525; }
        .day-cell.today { background: rgba(82, 121, 111, 0.1); border-color: var(--color-done); }
        .day-cell.empty { background: transparent; border: none; cursor: default; }
        .day-number { font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }
        
        .habit-dots { display: flex; flex-wrap: wrap; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; opacity: 0.9; }
        .dot.done { background-color: var(--color-done); }
        .dot.missed { background-color: var(--color-missed); }

        /* --- ESTADÍSTICAS ANUALES --- */
        .annual-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 30px; justify-items: center;
        }
        .annual-card {
            background: #252525; padding: 25px 20px; border-radius: 16px;
            border: 1px solid var(--border); width: 100%; max-width: 220px;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            transition: transform 0.2s;
        }
        .annual-card:hover { transform: translateY(-5px); border-color: #444; }

        /* Anillo Grande Anual */
        .ring-chart.large {
            width: 100px; height: 100px;
        }
        .ring-chart.large::before { inset: 12px; } /* Más grueso */
        .ring-chart.large .ring-text { font-size: 1.1rem; }

        .annual-title { font-size: 1rem; font-weight: 600; text-align: center; color: var(--text-main); }
        .annual-sub { font-size: 0.8rem; color: var(--text-muted); text-align: center; }
        .legend { display: flex; gap: 10px; font-size: 0.7rem; margin-top: 5px; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .dot-legend { width: 6px; height: 6px; border-radius: 50%; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
            z-index: 200; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.open { display: flex; opacity: 1; }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 30px; border-radius: 16px; width: 90%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        
        .habit-modal-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px; border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 12px; background: #252525; transition: border-color 0.2s;
        }
        .habit-modal-row:hover { border-color: #555; }

        .status-toggle {
            width: 44px; height: 44px; border-radius: 10px; border: 2px solid #333;
            background: transparent; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 1.4rem;
            transition: all 0.2s; flex-shrink: 0;
        }
        .status-toggle.state-none { border-color: #333; color: #333; }
        .status-toggle.state-done { background-color: var(--color-done); border-color: var(--color-done); color: #064e3b; }
        .status-toggle.state-missed { background-color: var(--color-missed); border-color: var(--color-missed); color: #3e1414; }

        .close-modal-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; float: right; }
        .close-modal-btn:hover { color: #fff; }

    </style>
</head>
<body>

<div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-content">
            
            <!-- Gestión -->
            <div class="card">
                <h2 style="border:none; color:var(--text-main); margin-bottom:15px;">Mis Hábitos</h2>
                <form id="habit-form">
                    <input type="text" id="habit-input" placeholder="Ej. Leer..." autocomplete="off">
                    <button type="submit" class="btn-primary">Crear Hábito</button>
                </form>
                <ul id="habit-list" class="habit-list" style="margin-top: 20px;"></ul>
                <div id="empty-habits-msg" style="text-align:center; color:#555; font-style:italic; margin-top:15px;">Vacío</div>
            </div>

            <!-- Mensual -->
            <div class="card">
                <h2>Resumen Mensual</h2>
                <div id="monthly-stats-container">
                    <!-- Generado por JS -->
                </div>
            </div>

        </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
        <div class="content-wrapper">
            
            <h1 id="page-header">Hábitos de Enero</h1>

            <!-- Calendario -->
            <div class="card" style="flex: 1; display:flex; flex-direction:column;">
                <div class="calendar-header">
                    <button class="month-nav-btn" id="prev-month">❮</button>
                    <button class="month-nav-btn" id="next-month">❯</button>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <div class="day-name">Dom</div>
                    <div class="day-name">Lun</div>
                    <div class="day-name">Mar</div>
                    <div class="day-name">Mié</div>
                    <div class="day-name">Jue</div>
                    <div class="day-name">Vie</div>
                    <div class="day-name">Sáb</div>
                </div>
            </div>

            <!-- Anual -->
            <div class="card">
                <h2>Rendimiento Anual</h2>
                <div class="annual-grid" id="annual-grid"></div>
            </div>

        </div>
    </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="day-modal">
    <div class="modal-content">
        <button class="close-modal-btn" onclick="document.getElementById('day-modal').classList.remove('open')">×</button>
        <h3 id="modal-date-title" style="color:var(--text-main); margin-bottom:20px; font-weight:600;">Editar Día</h3>
        <div id="modal-habits-container"></div>
    </div>
</div>

<script>
    const state = {
        currentDate: new Date(),
        habits: [],
        logs: {} 
    };

    const habitColors = ['#52796f', '#84a98c', '#cad2c5', '#2f4f4f', '#4d6c5f'];

    const habitForm = document.getElementById('habit-form');
    const habitInput = document.getElementById('habit-input');
    const habitListEl = document.getElementById('habit-list');
    const calendarGrid = document.getElementById('calendar-grid');
    const pageHeader = document.getElementById('page-header');
    const monthlyStatsEl = document.getElementById('monthly-stats-container');
    const annualGrid = document.getElementById('annual-grid');

    function init() {
        loadData();
        renderHabitList();
        renderCalendar();
        renderMonthlyStats();
        renderAnnualStats();
    }

    function loadData() {
        const saved = localStorage.getItem('habitTrackerProDual');
        if (saved) {
            const parsed = JSON.parse(saved);
            state.habits = parsed.habits || [];
            state.logs = parsed.logs || {};
            let needsSave = false;
            for (const date in state.logs) {
                if (state.logs[date].length > 0 && typeof state.logs[date][0] === 'string') {
                    state.logs[date] = state.logs[date].map(id => ({ id, status: 'done' }));
                    needsSave = true;
                }
            }
            if (needsSave) saveData();
        }
    }

    function saveData() {
        localStorage.setItem('habitTrackerProDual', JSON.stringify(state));
    }

    habitForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if(!habitInput.value.trim()) return;
        const newHabit = {
            id: Date.now().toString(),
            name: habitInput.value,
            color: habitColors[state.habits.length % habitColors.length]
        };
        state.habits.push(newHabit);
        saveData();
        habitInput.value = '';
        renderHabitList();
        renderCalendar();
        renderMonthlyStats();
        renderAnnualStats();
    });

    function deleteHabit(id) {
        if(!confirm('¿Eliminar?')) return;
        state.habits = state.habits.filter(h => h.id !== id);
        for(let d in state.logs) {
            state.logs[d] = state.logs[d].filter(entry => entry.id !== id);
            if(state.logs[d].length === 0) delete state.logs[d];
        }
        saveData();
        renderHabitList();
        renderCalendar();
        renderMonthlyStats();
        renderAnnualStats();
    }

    function cycleHabitStatus(dateStr, habitId) {
        if(!state.logs[dateStr]) state.logs[dateStr] = [];
        let entryIndex = state.logs[dateStr].findIndex(e => e.id === habitId);
        let currentStatus = entryIndex !== -1 ? state.logs[dateStr][entryIndex].status : null;

        let newStatus = 'done';
        if (currentStatus === 'done') newStatus = 'missed';
        else if (currentStatus === 'missed') {
            state.logs[dateStr].splice(entryIndex, 1);
            saveData();
            renderCalendar();
            renderMonthlyStats();
            renderAnnualStats();
            return;
        }

        if(entryIndex !== -1) state.logs[dateStr][entryIndex].status = newStatus;
        else state.logs[dateStr].push({ id: habitId, status: newStatus });
        
        saveData();
        renderCalendar();
        renderMonthlyStats();
        renderAnnualStats();
    }

    function renderHabitList() {
        habitListEl.innerHTML = '';
        if(state.habits.length === 0) document.getElementById('empty-habits-msg').style.display = 'block';
        else {
            document.getElementById('empty-habits-msg').style.display = 'none';
            state.habits.forEach(h => {
                const li = document.createElement('li');
                li.className = 'habit-item';
                li.style.borderLeftColor = h.color;
                li.innerHTML = `
                    <div class="habit-info">
                        <div class="habit-color" style="background:${h.color}"></div>
                        <span style="color:var(--text-main)">${h.name}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteHabit('${h.id}')">×</button>
                `;
                habitListEl.appendChild(li);
            });
        }
    }

    function changeMonth(dir) {
        state.currentDate.setMonth(state.currentDate.getMonth() + dir);
        renderCalendar();
        renderMonthlyStats();
        renderAnnualStats();
    }
    document.getElementById('prev-month').onclick = () => changeMonth(-1);
    document.getElementById('next-month').onclick = () => changeMonth(1);

    function renderCalendar() {
        const headers = Array.from(calendarGrid.querySelectorAll('.day-name'));
        calendarGrid.innerHTML = '';
        headers.forEach(h => calendarGrid.appendChild(h));

        const year = state.currentDate.getFullYear();
        const month = state.currentDate.getMonth();
        const monthNames = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
        pageHeader.textContent = `Hábitos de ${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();

        for(let i=0; i<firstDay; i++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell empty';
            calendarGrid.appendChild(cell);
        }

        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            if(today.getFullYear()===year && today.getMonth()===month && today.getDate()===d) cell.classList.add('today');

            cell.innerHTML = `<div class="day-number">${d}</div>`;
            const dots = document.createElement('div');
            dots.className = 'habit-dots';
            
            if(state.logs[dateStr]) {
                state.logs[dateStr].forEach(entry => {
                    const h = state.habits.find(x => x.id === entry.id);
                    if(h) {
                        const dot = document.createElement('div');
                        dot.className = `dot ${entry.status}`;
                        dots.appendChild(dot);
                    }
                });
            }
            cell.appendChild(dots);
            cell.onclick = () => openModal(dateStr);
            calendarGrid.appendChild(cell);
        }
    }

    // --- GRÁFICOS DE DOBLE ANILLO (CSS CONIC GRADIENT) ---
    function getConicGradient(pctDone, pctMissed) {
        const endGreen = pctDone;
        const endRed = pctDone + pctMissed;
        // Gradiente: Verde (0 -> GreenEnd), Rojo (GreenEnd -> RedEnd), Gris (RedEnd -> 100)
        return `conic-gradient(
            var(--color-done) 0% ${endGreen}%,
            var(--color-missed) ${endGreen}% ${endRed}%,
            var(--color-empty) ${endRed}% 100%
        )`;
    }

    function renderMonthlyStats() {
        monthlyStatsEl.innerHTML = '';
        const y = state.currentDate.getFullYear();
        const m = state.currentDate.getMonth();
        const daysInMonth = new Date(y, m+1, 0).getDate();

        state.habits.forEach(h => {
            let hDone = 0;
            let hMissed = 0;
            for(let d=1; d<=daysInMonth; d++) {
                const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                if(state.logs[ds]) {
                    const entry = state.logs[ds].find(e => e.id === h.id);
                    if(entry) {
                        if(entry.status === 'done') hDone++;
                        if(entry.status === 'missed') hMissed++;
                    }
                }
            }
            
            const pctDone = Math.round((hDone/daysInMonth)*100);
            const pctMissed = Math.round((hMissed/daysInMonth)*100);

            const row = document.createElement('div');
            row.className = 'stat-row';
            row.innerHTML = `
                <div class="ring-chart" style="background: ${getConicGradient(pctDone, pctMissed)}">
                    <span class="ring-text">${pctDone}%</span>
                </div>
                <div style="flex:1; margin-left: 10px;">
                    <div class="stat-name">${h.name}</div>
                    <div class="stat-details">
                        ${hDone} completados · ${hMissed} fallados
                    </div>
                </div>
            `;
            monthlyStatsEl.appendChild(row);
        });
    }

    function renderAnnualStats() {
        annualGrid.innerHTML = '';
        const currentYear = new Date().getFullYear();
        const isLeap = (currentYear % 4 === 0 && currentYear % 100 !== 0) || (currentYear % 400 === 0);
        const daysInYear = isLeap ? 366 : 365;

        state.habits.forEach(h => {
            let yDone = 0;
            let yMissed = 0;

            Object.keys(state.logs).forEach(dateStr => {
                if(dateStr.startsWith(currentYear + '-')) {
                    const entry = state.logs[dateStr].find(e => e.id === h.id);
                    if(entry) {
                        if(entry.status === 'done') yDone++;
                        if(entry.status === 'missed') yMissed++;
                    }
                }
            });

            const pctDone = Math.min(100, Math.round((yDone / daysInYear) * 100));
            const pctMissed = Math.min(100, Math.round((yMissed / daysInYear) * 100));

            const card = document.createElement('div');
            card.className = 'annual-card';
            card.innerHTML = `
                <div class="ring-chart large" style="background: ${getConicGradient(pctDone, pctMissed)}">
                    <span class="ring-text">${pctDone}%</span>
                </div>
                <div class="annual-title">${h.name}</div>
                <div class="annual-sub">${yDone} completados este año</div>
                ${yMissed > 0 ? `<div style="color:var(--color-missed); font-size:0.75rem;">${yMissed} fallados</div>` : ''}
            `;
            annualGrid.appendChild(card);
        });
    }

    function openModal(dateStr) {
        const modal = document.getElementById('day-modal');
        document.getElementById('modal-date-title').textContent = dateStr;
        const container = document.getElementById('modal-habits-container');
        container.innerHTML = '';
        
        state.habits.forEach(h => {
            let status = null;
            if(state.logs[dateStr]) {
                const entry = state.logs[dateStr].find(e => e.id === h.id);
                if(entry) status = entry.status;
            }

            const btnClass = status === 'done' ? 'state-done' : (status === 'missed' ? 'state-missed' : 'state-none');
            const icon = status === 'done' ? '✔' : (status === 'missed' ? '✘' : '•');
            
            const row = document.createElement('div');
            row.className = 'habit-modal-row';
            row.innerHTML = `
                <span style="color:var(--text-main); font-weight:500;">${h.name}</span>
                <button class="status-toggle ${btnClass}">${icon}</button>
            `;
            row.querySelector('.status-toggle').onclick = () => {
                cycleHabitStatus(dateStr, h.id);
                openModal(dateStr);
            };
            container.appendChild(row);
        });
        modal.classList.add('open');
    }

    document.getElementById('day-modal').onclick = (e) => {
        if(e.target.id === 'day-modal') e.target.classList.remove('open');
    };

    init();
</script>
</body>
</html>
